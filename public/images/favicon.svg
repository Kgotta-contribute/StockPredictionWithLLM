<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021b44"/>
      <stop offset="100%" stop-color="#010e24"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <line x1="12" y1="22" x2="52" y2="22" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="12" y1="36" x2="52" y2="36" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="12" y1="50" x2="52" y2="50" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Candlesticks in background -->
  <line x1="20" y1="28" x2="20" y2="48" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <rect x="18" y="32" width="4" height="14" rx="1" fill="#334155" opacity="0.6"/>

  <line x1="31" y1="20" x2="31" y2="44" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <rect x="29" y="24" width="4" height="18" rx="1" fill="#334155" opacity="0.6"/>

  <!-- Area under curve -->
  <path d="M 12 45 L 22 38 L 32 40 L 42 24 L 52 16 L 52 50 L 12 50 Z" fill="url(#areaGrad)"/>

  <!-- Upward Stock Trend Line -->
  <path d="M 12 45 L 22 38 L 32 40 L 42 24 L 52 16" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data point circles -->
  <circle cx="22" cy="38" r="2.5" fill="#10b981"/>
  <circle cx="32" cy="40" r="2.5" fill="#10b981"/>
  <circle cx="42" cy="24" r="2.5" fill="#34d399"/>
  <circle cx="52" cy="16" r="3.5" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
</svg>
